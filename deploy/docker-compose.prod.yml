# Production Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d

services:
  app:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    restart: unless-stopped
    deploy:
      replicas: 1
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  db:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
