name: Documentation & Link Integrity Check

on:
  push:
    branches: [ main ]
    paths:
      - "docs/**"
      - ".github/**/*.md"
      - "README.md"
      - "scripts/verify-docs.py"
  pull_request:
    branches: [ main ]
    paths:
      - "docs/**"
      - ".github/**/*.md"
      - "README.md"
      - "scripts/verify-docs.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-links:
    name: Verify Markdown Links & References
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Documentation Verification
        run: python3 scripts/verify-docs.py
